<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Amazon.com</title>
</head>
<body>
    <header>
        <nav>
            <!--adding "/" in href will take us to home page when the logo i clicked-->
            <a href="/" target="_blank">
            <img src="images/amazonWhite.png"
           alt="Amazon logo" id="amazonLogo" width="100">
            </a>

            <div class="navlocation">
                <img src="images/loc.png" alt="location" height="20">
                <div>
                    <p> Deliver to</p>
                    <h1> India</h1>
                </div>
            </div>

            <div class="navsearch">
                <div class="navsearchGate">
                    <p>All</p>
                    <img src="images/dropdown.png" height="20" alt="dropdown icon">
                </div>
                <input type="text" class="navsearchBar" placeholder="Search Amazon">
                <img src="images/search.png" alt="search engine" class="navsearchIcon">
            </div>

            <div class="navlanguage">
                <img src="images/eng.png" alt="US flag icon" width="25">
                <p>EN</p>
                <img src="images/dropdown.png" alt="dropdown icon" width="18px">
            </div>
            <div class="navtext">
                <p>Hello, sign in</p>
                <h1>Account and lists <img src="images/dropdown.png" width="18px"></h1>
            </div>
            <div class="navtext">
                <p>Returns</p>
                <h1>& Orders<img src="images/dropdown.png" width="18px"></h1>
            </div>
            <div class="navcart">
                <a href="">
                    <img src="images/cart.svg" alt="cart icon" height="35">
                    <h4>Cart</h4>
                </a>
            </div>
        </nav>

        <div class="navmenu">
            <img src="images/menu.svg"
        </div>
    </header>
    <main>


    </main>

    <footer>
       
    </footer>

    
</body>
</html>
